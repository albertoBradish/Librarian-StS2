name: Pure rule tests
on:
  push:
    branches: [main, codex/beta]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Test authored rules without game binaries
        run: dotnet run --project tests/Librarian.Core.Tests/Librarian.Core.Tests.csproj -c Release
      - name: Test progress JSON preservation without game binaries
        run: dotnet run --project tests/Librarian.Progress.Tests/Librarian.Progress.Tests.csproj -c Release
      - name: Test universal loader selection and initialization
        if: hashFiles('tests/Librarian.Loader.Tests/Librarian.Loader.Tests.csproj') != ''
        run: dotnet run --project tests/Librarian.Loader.Tests/Librarian.Loader.Tests.csproj -c Release
      - name: Test universal package validation
        if: hashFiles('tests/test_librarian_bundle.py') != ''
        run: python3 tests/test_librarian_bundle.py
